app = 'islami-jindegi-web'
# Temporarily 'sin': the org is over its per-region memory quota in 'bom',
# which blocks new machine creation there. Fly IPs are global anycast and
# certs are per-app, so this needs no DNS or Cloudflare change. Move back
# to 'bom' once the quota is raised — the API lives there, so SSR calls
# currently cross regions.
primary_region = 'sin'

[build]
  [build.args]
    NEXT_PUBLIC_API_URL = 'https://islami-jindegi-dotnet-api.fly.dev'
    NEXT_PUBLIC_GOOGLE_CLIENT_ID = '218822188400-325p6t97csen9e944piah1h6ludvmoo6.apps.googleusercontent.com'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
